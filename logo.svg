<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hyperedge Ring -->
  <path d="M 50 15 A 35 35 0 1 1 49.9 15 Z" fill="none" stroke="url(#cyan-violet)" stroke-width="2.5" opacity="0.3" stroke-dasharray="4 2" />
  
  <!-- Intersecting Hyperedges -->
  <path d="M 30 50 C 30 35, 70 35, 70 50 C 70 65, 30 65, 30 50 Z" fill="none" stroke="url(#cyan-violet)" stroke-width="3" filter="url(#glow)" />
  <path d="M 50 30 C 65 30, 65 70, 50 70 C 35 70, 35 30, 50 30 Z" fill="none" stroke="url(#cyan-violet)" stroke-width="1.5" opacity="0.75" />

  <!-- Node Elements -->
  <circle cx="50" cy="30" r="5" fill="#ec4899" filter="url(#glow)" />
  <circle cx="50" cy="70" r="5" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="30" cy="50" r="5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="70" cy="50" r="5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
  
  <!-- Connections -->
  <line x1="50" y1="30" x2="50" y2="70" stroke="#ffffff" stroke-width="0.75" opacity="0.4" />
  <line x1="30" y1="50" x2="70" y2="50" stroke="#ffffff" stroke-width="0.75" opacity="0.4" />
</svg>
